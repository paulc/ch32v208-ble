[package]
name = "ch32v208-ble-min"
version = "0.1.0"
edition = "2024"

[dependencies]
qingke = "0.8"
qingke-rt = "0.8"

ch32-hal = { 
    git = "https://github.com/ch32-rs/ch32-hal", 
    features = [
        "ch32v208wbu6",   # CH32V208WBU6 (QFN68)
        "memory-x",
        "rt",
        "embassy",
    ], 
    default-features = false 
}

embassy-executor = { version = "0.10.0", features = [
    "platform-spin",
    "executor-thread",
] }

embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = { version = "0.5.1" }
embassy-usb-driver = "0.2.2"
embassy-futures = { version = "0.1.2" }

embedded-hal = "1.0.0"
embedded-hal-async = "1.0.0"

panic-halt = "1.0"
portable-atomic = { version = "1.14.0", features = ["critical-section"] }
ufmt = { version = "0.2.0" }
heapless = { version = "0.9.3", features = ["ufmt"] }
static_cell = "2.1.1"
critical-section = "1.2.0"

[profile.release]
opt-level = "z"        # try "s" too — sometimes wins
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2              # free: DWARF isn't ALLOC, never reaches flash
overflow-checks = false
debug-assertions = false
incremental = false
strip = false          # keep symbols for wlink regs → dpc lookup
